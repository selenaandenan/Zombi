<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZOMBIE CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0a0f0a; 
            --main-green: #39ff14; 
            --dark-green: #1a3b12; 
            --text-color: #e0f2e0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #122910, transparent 60%);
        }
        .header { text-align: center; padding: 20px; border-bottom: 2px solid var(--dark-green); }
        .header h1 { color: var(--main-green); font-size: 24px; text-transform: uppercase; text-shadow: 0 0 10px var(--main-green); }
        .balance-bar { text-align: center; padding: 15px; background: rgba(26, 59, 18, 0.5); font-size: 18px; font-weight: bold; }
        .balance-bar span { color: var(--main-green); font-size: 22px; text-shadow: 0 0 8px var(--main-green); }
        
        .cases-container { padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .case-card {
            width: 100%; max-width: 400px; background: var(--dark-green);
            border: 2px solid var(--main-green); border-radius: 10px;
            padding: 20px; text-align: center; cursor: pointer;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }
        .case-card:active { transform: scale(0.98); }
        .case-title { font-size: 20px; color: #fff; margin-bottom: 5px; text-transform: uppercase; }
        .case-price { color: var(--main-green); font-size: 16px; font-weight: bold; margin-bottom: 15px; }
        .case-img { font-size: 60px; margin-bottom: 10px; filter: drop-shadow(0 0 10px var(--main-green)); animation: float 2s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .case-btn {
            background: transparent; border: 2px solid var(--main-green); color: var(--main-green);
            padding: 12px 30px; font-size: 16px; font-weight: bold; text-transform: uppercase;
            cursor: pointer; border-radius: 5px; width: 100%; transition: all 0.2s;
        }
        .case-btn:active { background: var(--main-green); color: #000; }

        /* Модальное окно */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.95); z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .spinner-container { width: 300px; height: 150px; border: 2px solid var(--dark-green); overflow: hidden; position: relative; background: #000; border-radius: 10px; }
        .spinner-line { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: var(--main-green); transform: translateY(-50%); z-index: 10; box-shadow: 0 0 10px var(--main-green); }
        .spinner-items { display: flex; height: 100%; align-items: center; transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .spinner-item { min-width: 100px; text-align: center; font-size: 30px; color: var(--main-green); font-weight: bold; }
        .win-text { color: var(--main-green); font-size: 30px; margin-top: 20px; text-shadow: 0 0 15px var(--main-green); opacity: 0; transform: scale(0.5); transition: all 0.5s; }
        .win-text.show { opacity: 1; transform: scale(1); }
        .close-modal { margin-top: 30px; padding: 10px 20px; background: transparent; border: 1px solid #555; color: #888; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header"><h1>ZOMBIE CASINO</h1></div>
    <div class="balance-bar">БАЛАНС: <span id="balance-val">0</span> ⭐</div>
    <div class="cases-container" id="cases-container"></div>

    <div class="modal" id="spin-modal">
        <h2 style="color: #fff; margin-bottom: 20px;">КРУТИМ...</h2>
        <div class="spinner-container">
            <div class="spinner-line"></div>
            <div class="spinner-items" id="spinner-items"></div>
        </div>
        <div class="win-text" id="win-text">+0 ⭐</div>
        <button class="close-modal" onclick="closeModal()">ЗАКРЫТЬ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let currentBalance = 500; // Для визуального теста (в реале бот присылает)
        document.getElementById('balance-val').innerText = currentBalance;

        const cases = [
            { id: "cheap", title: "Гнилой кейс", price: 25, icon: "☣️" },
            { id: "expensive", title: "Мутант кейс", price: 150, icon: "🧬" }
        ];

        const container = document.getElementById('cases-container');
        cases.forEach(c => {
            const card = document.createElement('div');
            card.className = 'case-card';
            card.innerHTML = `
                <div class="case-img">${c.icon}</div>
                <div class="case-title">${c.title}</div>
                <div class="case-price">${c.price} ⭐</div>
                <button class="case-btn" onclick="openCase('${c.id}', ${c.price})">Открыть</button>
            `;
            container.appendChild(card);
        });

        function openCase(caseId, price) {
            if (currentBalance < price) {
                tg.showAlert("❌ Недостаточно звезд!");
                return;
            }

            // Отправляем данные в бота (Python)
            tg.sendData(JSON.stringify({
                action: "open_case",
                case_id: caseId,
                price: price
            }));

            // Запускаем визуальную анимацию
            startSpinAnimation(caseId, price);
        }

        function startSpinAnimation(caseId, price) {
            const modal = document.getElementById('spin-modal');
            const itemsContainer = document.getElementById('spinner-items');
            const winText = document.getElementById('win-text');
            
            modal.classList.add('active');
            winText.classList.remove('show');

            itemsContainer.style.transition = 'none';
            itemsContainer.style.transform = 'translateX(0)';
            itemsContainer.innerHTML = '';

            let possibleWins = caseId === 'cheap' ? [15, 25, 50, 100] : [50, 100, 500];
            
            for (let i = 0; i < 50; i++) {
                let randomWin = possibleWins[Math.floor(Math.random() * possibleWins.length)];
                let div = document.createElement('div');
                div.className = 'spinner-item';
                div.innerText = randomWin + '⭐';
                itemsContainer.appendChild(div);
            }

            setTimeout(() => {
                itemsContainer.style.transition = 'transform 3s cubic-bezier(0.1, 0.7, 0.1, 1)';
                itemsContainer.style.transform = `translateX(-${35 * 100}px)`;

                setTimeout(() => {
                    let finalWin = possibleWins[Math.floor(Math.random() * possibleWins.length)];
                    winText.innerText = `ВЫБИЛ: +${finalWin} ⭐`;
                    winText.classList.add('show');
                    
                    tg.HapticFeedback.notificationOccurred('success');
                    currentBalance = currentBalance - price + finalWin;
                    document.getElementById('balance-val').innerText = currentBalance;
                }, 3000);
            }, 100);
        }

        function closeModal() {
            document.getElementById('spin-modal').classList.remove('active');
        }
    </script>
</body>
</html>
