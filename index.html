<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZOMBIE CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0a0f0a;
            --main: #39ff14; /* Токсичный зеленый */
            --dark: #1a3b12;
            --text: #e0f2e0;
            --red: #ff3333;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #122910, transparent 60%);
            overflow-x: hidden;
        }

        /* Шапка */
        .header {
            text-align: center;
            padding: 15px;
            border-bottom: 2px solid var(--dark);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.1);
        }

        .header h1 {
            color: var(--main);
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--main);
            animation: flicker 3s infinite alternate;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { text-shadow: 0 0 10px var(--main), 0 0 20px var(--main); }
            20%, 24%, 55% { text-shadow: none; opacity: 0.8; }
        }

        /* Верхняя панель с балансом */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(26, 59, 18, 0.8);
            border-bottom: 1px solid var(--main);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .balance-info {
            font-size: 14px;
            font-weight: bold;
        }

        .balance-info span {
            color: var(--main);
            font-size: 18px;
            text-shadow: 0 0 8px var(--main);
        }

        .nav-btns button {
            background: transparent;
            border: 1px solid var(--main);
            color: var(--main);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .nav-btns button:active { background: var(--main); color: #000; }

        /* Сетка игр */
        .games {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .game-card {
            width: 100%;
            max-width: 400px;
            background: var(--dark);
            border: 2px solid var(--main);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
        }

        .game-card:active { transform: scale(0.98); }

        .game-title { font-size: 18px; color: #fff; margin-bottom: 5px; text-transform: uppercase; text-shadow: 0 0 5px #fff; }
        .game-price { color: var(--main); font-size: 14px; font-weight: bold; margin-bottom: 15px; }
        .game-icon { font-size: 50px; margin-bottom: 10px; filter: drop-shadow(0 0 10px var(--main)); animation: float 2s ease-in-out infinite; }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .game-btn {
            background: transparent;
            border: 2px solid var(--main);
            color: var(--main);
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            transition: all 0.2s;
        }

        .game-btn:active {
            background: var(--main);
            color: #000;
            box-shadow: 0 0 20px var(--main);
        }

        /* Модальное окно (Анимация) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal.active { display: flex; }
        .modal h2 { color: #fff; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }

        /* Спиннер (Кейсы) */
        .spinner-box {
            width: 300px;
            height: 100px;
            border: 2px solid var(--dark);
            overflow: hidden;
            position: relative;
            background: #000;
            border-radius: 10px;
        }

        .spinner-line {
            position: absolute;
            top: 50%;
            left: 0; right: 0;
            height: 2px;
            background: var(--main);
            transform: translateY(-50%);
            z-index: 10;
            box-shadow: 0 0 10px var(--main);
        }
        
        .spinner-items {
            display: flex;
            height: 100%;
            align-items: center;
            transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .spinner-item {
            min-width: 100px;
            text-align: center;
            font-size: 22px;
            color: var(--main);
            font-weight: bold;
        }

        /* Рулетка */
        .roulette-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: var(--main);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
        }

        .roulette-circle.spinning {
            animation: spin 0.5s linear infinite;
            border-color: var(--main);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Результат */
        .result {
            color: var(--main);
            font-size: 24px;
            margin-top: 20px;
            text-shadow: 0 0 15px var(--main);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s;
            text-align: center;
            font-weight: bold;
        }

        .result.lose { color: var(--red); text-shadow: 0 0 15px var(--red); }
        .result.show { opacity: 1; transform: scale(1); }

        .close-btn {
            margin-top: 25px;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid #555;
            color: #888;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ZOMBIE CASINO</h1>
    </div>

    <div class="top-bar">
        <div class="balance-info">БАЛАНС: <span id="balance-val">0</span> ⭐</div>
        <div class="nav-btns">
            <button onclick="sendAction('topup')">+ ПОПОЛНИТЬ</button>
            <button onclick="sendAction('withdraw')">ВЫВОД</button>
        </div>
    </div>

    <div class="games">
        <!-- Дешевый кейс -->
        <div class="game-card">
            <div class="game-icon">☣️</div>
            <div class="game-title">Гнилой кейс</div>
            <div class="game-price">Ставка: 25 ⭐ (Шанс до 100⭐)</div>
            <button class="game-btn" onclick="playCase('cheap', 25)">Открыть</button>
        </div>

        <!-- Дорогой кейс -->
        <div class="game-card">
            <div class="game-icon">🧬</div>
            <div class="game-title">Мутант кейс</div>
            <div class="game-price">Ставка: 150 ⭐ (Шанс до 500⭐)</div>
            <button class="game-btn" onclick="playCase('expensive', 150)">Открыть</button>
        </div>

        <!-- Рулетка -->
        <div class="game-card">
            <div class="game-icon">🎡</div>
            <div class="game-title">Зомби-Рулетка</div>
            <div class="game-price">Ставка: 50 ⭐ (Множители x0, x2, x3)</div>
            <button class="game-btn" onclick="playRoulette(50)">Крутить</button>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="game-modal">
        <h2 id="modal-title">КРУТИМ...</h2>
        
        <div class="spinner-box" id="case-spinner" style="display:none;">
            <div class="spinner-line"></div>
            <div class="spinner-items" id="spinner-items"></div>
        </div>

        <div class="roulette-circle" id="roulette-circle" style="display:none;">?</div>

        <div class="result" id="win-text">+0 ⭐</div>
        <button class="close-btn" onclick="closeModal()">ЗАКРЫТЬ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); 
        tg.expand();
        tg.setHeaderColor('#0a0f0a');
        tg.setBackgroundColor('#0a0f0a');

        // Стартовый баланс (бот потом пришлет реальный)
        let currentBalance = 500; 
        document.getElementById('balance-val').innerText = currentBalance;

        // Отправка команд в бота (Пополнить/Вывод)
        function sendAction(action) {
            tg.sendData(JSON.stringify({ action: action }));
        }

        // --- ИГРА: КЕЙСЫ ---
        function playCase(caseId, price) {
            if (currentBalance < price) {
                tg.showAlert("❌ Недостаточно звезд на балансе!");
                return;
            }

            // Отправляем боту инфу, что игрок крутит кейс
            tg.sendData(JSON.stringify({ action: "open_case", case_id: caseId, price: price }));

            // Настройка окна под кейс
            document.getElementById('modal-title').innerText = "КРУТИМ КЕЙС...";
            document.getElementById('case-spinner').style.display = 'block';
            document.getElementById('roulette-circle').style.display = 'none';
            
            startSpinAnimation(caseId, price);
        }

        function startSpinAnimation(caseId, price) {
            const modal = document.getElementById('game-modal');
            const itemsContainer = document.getElementById('spinner-items');
            const winText = document.getElementById('win-text');
            
            modal.classList.add('active');
            winText.classList.remove('show', 'lose');

            itemsContainer.style.transition = 'none';
            itemsContainer.style.transform = 'translateX(0)';
            itemsContainer.innerHTML = '';

            // Возможные призы
            let possibleWins = caseId === 'cheap' ? [15, 25, 50, 100] : [50, 100, 500];
            
            // Генерируем 50 карточек для анимации
            for (let i = 0; i < 50; i++) {
                let randomWin = possibleWins[Math.floor(Math.random() * possibleWins.length)];
                let div = document.createElement('div');
                div.className = 'spinner-item';
                div.innerText = randomWin + '⭐';
                itemsContainer.appendChild(div);
            }

            // Запуск прокрутки через 0.1 сек
            setTimeout(() => {
                itemsContainer.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)';
                itemsContainer.style.transform = `translateX(-${35 * 100}px)`;

                // Когда прокрутка остановится (через 4 сек)
                setTimeout(() => {
                    let finalWin = possibleWins[Math.floor(Math.random() * possibleWins.length)];
                    winText.innerText = `ВЫБИЛ: +${finalWin} ⭐`;
                    winText.classList.add('show');
                    
                    tg.HapticFeedback.notificationOccurred('success');
                    
                    // Обновляем баланс на сайте
                    currentBalance = currentBalance - price + finalWin;
                    document.getElementById('balance-val').innerText = currentBalance;
                }, 4000);
            }, 100);
        }

        // --- ИГРА: РУЛЕТКА ---
        function playRoulette(price) {
            if (currentBalance < price) {
                tg.showAlert("❌ Недостаточно звезд!");
                return;
            }

            tg.sendData(JSON.stringify({ action: "roulette", price: price }));

            document.getElementById('modal-title').innerText = "КРУТИМ РУЛЕТКУ...";
            document.getElementById('case-spinner').style.display = 'none';
            document.getElementById('roulette-circle').style.display = 'flex';
            
            const modal = document.getElementById('game-modal');
            const circle = document.getElementById('roulette-circle');
            const winText = document.getElementById('win-text');
            
            modal.classList.add('active');
            winText.classList.remove('show', 'lose');
            circle.classList.add('spinning');
            circle.innerText = "?";

            setTimeout(() => {
                circle.classList.remove('spinning');
                
                // Рандом x0, x2, x3
                const multipliers = [0, 2, 3];
                const result = multipliers[Math.floor(Math.random() * multipliers.length)];
                
                if (result === 0) {
                    circle.innerText = "X0";
                    winText.innerText = "ВЫ ПРОИГРАЛИ";
                    winText.classList.add('lose', 'show');
                    currentBalance -= price;
                } else {
                    circle.innerText = `X${result}`;
                    let win = price * result;
                    winText.innerText = `+${win} ⭐`;
                    winText.classList.add('show');
                    currentBalance = currentBalance - price + win;
                }
                
                tg.HapticFeedback.notificationOccurred(result === 0 ? 'error' : 'success');
                document.getElementById('balance-val').innerText = currentBalance;
                
            }, 3000);
        }

        // Закрыть окно
        function closeModal() {
            document.getElementById('game-modal').classList.remove('active');
        }
    </script>
</body>
</html>
</body>
</html>
